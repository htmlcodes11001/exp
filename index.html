<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expedientes de Peones</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#1f1f1f">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <h1>📁 Expedientes</h1>
        <input type="text" id="buscador" placeholder="Buscar peon...">
        <button id="btn-nuevo">➕ Nuevo peon</button>
      </div>
      <div id="lista-personajes"></div>
      <div id="sidebar-footer">
        <button class="btn-mini" id="btn-exportar-todo">⬇️ Exportar copia</button>
        <label class="btn-mini" style="text-align:center; cursor:pointer;">
          ⬆️ Importar
          <input type="file" id="input-importar" accept=".json" style="display:none;">
        </label>
      </div>
    </aside>

    <main id="panel">
      <div id="ficha-vacia">Selecciona un peon o crea uno nuevo para empezar.</div>
    </main>
  </div>

  <script src="js/db.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((err) => {
          console.warn('No se pudo registrar el service worker:', err);
        });
      });
    }
  </script>
</body>
</html>
